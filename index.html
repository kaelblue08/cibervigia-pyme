                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '4px' }}>Nombre del Negocio</label>
                      <input required type="text" value={formVolunteers.businessName} onChange={e => setFormVolunteers({ ...formVolunteers, businessName: e.target.value })} placeholder="Ej: Minisúper El Sol" style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', color: '#ffffff' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '4px' }}>Nombre de Contacto</label>
                      <input required type="text" value={formVolunteers.contactName} onChange={e => setFormVolunteers({ ...formVolunteers, contactName: e.target.value })} placeholder="Ej: María Rodríguez" style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', color: '#ffffff' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '4px' }}>Teléfono / WhatsApp</label>
                      <input required type="tel" value={formVolunteers.phone} onChange={e => setFormVolunteers({ ...formVolunteers, phone: e.target.value })} placeholder="+507 6298-8190" style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', color: '#ffffff' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '4px' }}>Correo Electrónico (Opcional)</label>
                      <input type="email" value={formVolunteers.email} onChange={e => setFormVolunteers({ ...formVolunteers, email: e.target.value })} placeholder="ejemplo@negocio.com" style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', color: '#ffffff' }} />
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '4px' }}>Provincia / País</label>
                      <select value={formVolunteers.province} onChange={e => setFormVolunteers({ ...formVolunteers, province: e.target.value })} style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: '#111927', border: '1px solid rgba(255,255,255,0.1)', color: '#ffffff' }}>
                        <option value="Panamá">Panamá (Ciudad)</option>
                        <option value="Chiriquí">Chiriquí</option>
                        <option value="Panamá Oeste">Panamá Oeste</option>
                        <option value="Veraguas">Veraguas</option>
                        <option value="Colón">Colón</option>
                        <option value="Otro">Otro país de América Latina</option>
                      </select>
                    </div>
                    <div style={{ gridColumn: '1 / -1' }}>
                      <label style={{ display: 'block', fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '4px' }}>Detalles de la consulta</label>
                      <textarea rows={3} value={formVolunteers.details} onChange={e => setFormVolunteers({ ...formVolunteers, details: e.target.value })} placeholder="¿Qué problema o duda tienes?" style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--radius-sm)', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', color: '#ffffff' }} />
                    </div>

                    <div style={{ gridColumn: '1 / -1', display: 'flex', gap: '14px', justifyContent: 'flex-end', flexWrap: 'wrap', borderTop: '1px solid var(--border-color)', paddingTop: '16px' }}>
                      <button type="button" onClick={handleOpenWhatsApp} className="btn-whatsapp" style={{ padding: '12px 24px' }}>
                        💬 Enviar a mi WhatsApp (+507 6298-8190)
                      </button>

                      <button type="submit" disabled={sendingEmail} className="btn-primary" style={{ padding: '12px 28px', opacity: sendingEmail ? 0.6 : 1 }}>
                        📧 {sendingEmail ? 'Enviando Correo...' : 'Enviar a kaelpinedaa04@gmail.com'}
                      </button>
                    </div>
                  </form>
                )}
              </section>
            )}

            {/* SOBRE EL PROYECTO */}
            {activeTab === 'proposal' && (
              <section className="animate-fade-in" style={{ maxWidth: '920px', margin: '0 auto' }}>
                <div className="glass-card" style={{ padding: '36px', marginBottom: '24px', border: '1px solid rgba(56, 189, 248, 0.3)' }}>
                  <span className="badge badge-cyan" style={{ marginBottom: '8px' }}>PROYECTO INDEPENDIENTE</span>
                  <h2 style={{ fontSize: '2rem', fontWeight: '800', color: '#ffffff', marginBottom: '8px' }}>CiberVigía Pyme</h2>
                  <p style={{ color: 'var(--accent-cyan)', fontSize: '1.05rem', marginBottom: '16px' }}>
                    Plataforma de diagnóstico de ciberseguridad gratuita para pymes latinoamericanas
                  </p>
                  <div style={{ fontSize: '0.88rem', color: 'var(--text-muted)' }}>
                    <strong>Jordy Kael Pineda D'Meza</strong> · Técnico Superior en Ciberseguridad (ITSE, Panamá, República de Panamá)
                  </div>
                </div>

                <div className="glass-card" style={{ padding: '28px', marginBottom: '20px' }}>
                  <h4 style={{ color: '#ffffff', fontWeight: '700', fontSize: '1.15rem', marginBottom: '10px' }}>Resumen del Proyecto</h4>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.92rem', lineHeight: 1.6 }}>
                    CiberVigía Pyme es una plataforma web gratuita y de código abierto para que dueños de pymes en América Latina puedan diagnosticar si su negocio fue comprometido digitalmente, sin necesidad de saber de tecnología. Al finalizar reciben un plan de acción concreto y accesible para mejorar su seguridad. La idea surgió al investigar la situación de las pymes en la región: miles operan con sistemas vulnerables sin saberlo y sin presupuesto para protegerse.
                  </p>
                </div>

                <div className="glass-card" style={{ padding: '28px', marginBottom: '20px' }}>
                  <h4 style={{ color: '#ffffff', fontWeight: '700', fontSize: '1.15rem', marginBottom: '10px' }}>El Problema en América Latina</h4>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.92rem', lineHeight: 1.6 }}>
                    1. <strong>No se dan cuenta de que fueron atacadas:</strong> El tiempo promedio antes de descubrir un ataque supera los 200 días.<br />
                    2. <strong>No pueden pagar soluciones:</strong> Una auditoría básica en Panamá y Centroamérica cuesta más de $1,500 USD.<br />
                    3. <strong>No saben por dónde empezar:</strong> Falta de cultura de seguridad, claves compartidas y ausencia de respaldos.
                  </p>
                </div>

                <div className="glass-card" style={{ padding: '28px' }}>
                  <h4 style={{ color: '#ffffff', fontWeight: '700', fontSize: '1.15rem', marginBottom: '10px' }}>Visión de Impacto</h4>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.92rem', lineHeight: 1.6 }}>
                    • <strong>Fase Inicial:</strong> Diagnóstico gratuito para pymes en Chiriquí y Ciudad de Panamá, red de estudiantes voluntarios del ITSE.<br />
                    • <strong>Fase de Escalamiento:</strong> Expansión regional a Costa Rica, Guatemala, Honduras, El Salvador, Nicaragua y Colombia.<br />
                    • <strong>Fase de Consolidación:</strong> Plataforma abierta de inteligencia de amenazas anonimizadas y capacitaciones para pymes.
                  </p>
                </div>
              </section>
            )}

          </main>

          {/* FOOTER */}
          <footer style={{ background: '#070a12', borderTop: '1px solid var(--border-color)', padding: '20px 0', fontSize: '0.82rem', color: 'var(--text-muted)' }}>
            <div className="app-container" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
              <div><strong style={{ color: '#ffffff' }}>CiberVigía Pyme</strong> · Ciberseguridad Gratuita para América Latina</div>
              <div>Jordy Kael Pineda D'Meza · Proyecto Personal · ITSE Panamá</div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
